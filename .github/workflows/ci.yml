name: RaceDay CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RaceDay.API.slnx

      - name: Build
        run: dotnet build RaceDay.API.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test RaceDay.API.slnx --configuration Release --no-build --logger "trx;LogFileName=raceday-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raceday-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
